<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天然气全链条安全智管智能体</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">综合场景驾驶舱 / 子页面</p>
          <h1>天然气全链条安全智管智能体</h1>
        </div>
        <div class="top-actions" aria-live="polite">
          <span class="status-dot"></span>
          <span id="updatedAt">更新时间 --</span>
        </div>
      </header>

      <section class="enterprise-monitor-strip" aria-label="企业与老人用气动态监测">
        <section class="panel enterprise-monitor-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Enterprise Gas</p>
              <h2>企业用气动态监测</h2>
            </div>
          </div>
          <div id="enterpriseStatsContent" class="enterprise-stats-content"></div>
          <div id="enterpriseRiskContent" class="enterprise-risk-content"></div>
        </section>

        <section class="panel elderly-monitor-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow muted-eyebrow">Elderly Gas</p>
              <h2>独居老人智慧用气动态监测</h2>
            </div>
          </div>
          <div id="elderlyMonitorContent" class="elderly-monitor-content"></div>
        </section>
      </section>

      <section class="pipeline-safety-section" aria-label="燃气管道安全管控">
        <h2 class="section-title">燃气管道安全管控</h2>

        <section class="risk-control-strip" aria-label="风险趋势与高风险管控">
          <section class="panel trend-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Risk Trend</p>
                <h2>风险次数趋势</h2>
              </div>
              <div class="trend-actions">
                <span class="chip" id="riskTrendLabel">今日</span>
                <select id="riskTrendRange" aria-label="风险趋势时间范围">
                  <option value="today">今日</option>
                  <option value="week">近7天</option>
                  <option value="month">近30天</option>
                </select>
              </div>
            </div>
            <canvas id="riskTrendCanvas" width="960" height="360" aria-label="风险趋势图"></canvas>
          </section>

          <section class="panel ratio-panel">
            <div class="ratio-head">
              <p class="eyebrow">Major Risk Control</p>
              <h2>重大风险集中管控</h2>
              <p>点击风险类型，联动下方告警列表与研判结果。</p>
            </div>
            <div id="typeRatioBars" class="type-bars"></div>
          </section>
        </section>

        <main class="alert-workbench">
          <section class="alert-main">
            <section class="panel map-panel">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Realtime Alerts</p>
                  <h2>实时告警</h2>
                </div>
                <div class="alert-head-meta">
                  <div id="riskLevelLegend" class="risk-level-legend"></div>
                  <span class="chip" id="realtimeMetricLabel">视频预警</span>
                </div>
              </div>
              <div class="risk-filter-bar" aria-label="风险类型筛选">
                <div id="riskList" class="risk-list"></div>
              </div>
              <div id="realtimeContent"></div>
            </section>

            <section class="panel selected-analysis">
              <div class="panel-head compact">
                <div>
                  <p class="eyebrow">AI Analysis</p>
                  <h2>智能研判结果</h2>
                </div>
                <div class="selected-analysis-meta">
                  <button class="live-monitor-button analysis-head-live" id="selectedLiveMonitorButton" type="button" hidden>调用实时监控画面</button>
                  <span class="chip" id="selectedAlertLabel">--</span>
                </div>
              </div>
              <div id="selectedAnalysis"></div>
            </section>
          </section>
        </main>
      </section>
    </div>

    <div class="video-modal" id="videoModal" aria-hidden="true">
      <button class="video-modal-backdrop" type="button" data-video-close aria-label="关闭视频"></button>
      <section class="video-modal-panel" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle">
        <div class="video-modal-head">
          <strong id="videoModalTitle">视频预警</strong>
          <button type="button" data-video-close>关闭</button>
        </div>
        <video id="videoModalPlayer" controls preload="auto" playsinline></video>
      </section>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
